<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Inter',sans-serif;background:#F4F5F7;overflow-x:hidden;color:#111827}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,97,60,.25)}50%{box-shadow:0 0 0 8px rgba(232,97,60,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flowDash{to{stroke-dashoffset:-12}}
.fu{animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
.fi{animation:fadeIn .5s ease both}
.si{animation:slideIn .5s cubic-bezier(.22,1,.36,1) both}
.hover-lift{transition:transform .22s,box-shadow .22s}
.hover-lift:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:6px}
</style>

}

    <div style={{ background:X.surf, borderRadius:10, padding:"10px 14px", fontFamily:mono, fontSize:10.5, lineHeight:1.9, border:"1px solid "+X.bdr }}>

        <div key={k}><span style={{ color, fontWeight:600 }}>{k}:</span>{" "}<span style={{ color:X.t2 }}>{String(v)}</span></div>
      ))}
    </div>
  );
}

function ArchDiagram({ active, setActive }) {
  const W=1000, H=320, nodeW=108, nodeH=76, gap=8;
  const n=PIPELINE.length;
  const totalW=n*nodeW+(n-1)*gap;
  const startX=(W-totalW)/2;
  const nodeY=55;
  const kpiY=nodeY+nodeH+38;
  const nx=i=>startX+i*(nodeW+gap);

  return (
    <section className="fu" style={{ animationDelay:".15s", margin:"24px 24px 0", background:X.card, borderRadius:18, border:"1px solid "+X.bdr, boxShadow:X.sh, padding:"28px 32px 20px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:800, color:X.t1, marginBottom:6 }}>Architecture — How Agents Connect</div>
          <div style={{ fontSize:12, color:X.t3 }}>Click any stage to explore what each agent does</div>
        </div>
        {active!==null && <button onClick={()=>setActive(null)} style={{ fontSize:11, color:X.t3, background:"none", border:"1px solid "+X.bdr, borderRadius:8, padding:"4px 12px", cursor:"pointer" }}>Clear selection ×</button>}
      </div>

      <svg viewBox={"0 0 "+W+" "+H} style={{ width:"100%", display:"block" }}>
        <text x={W/2} y={20} textAnchor="middle" fontSize="8" fontWeight="800" fill={X.t1} letterSpacing=".08em" fontFamily="Inter">ASSUREAI PIPELINE — 8 AUTONOMOUS AGENTS</text>

        {PIPELINE.slice(0,-1).map((_,i)=>{
          const x1=nx(i)+nodeW, x2=nx(i+1), cy=nodeY+nodeH/2;
          return <g key={"line"+i}><line x1={x1} y1={cy} x2={x2} y2={cy} stroke={X.bdr2} strokeWidth="1.5" strokeDasharray="4 3" style={{ animation:"flowDash 1s linear infinite" }}/><polygon points={(x2-2)+","+(cy-4)+" "+(x2+4)+","+cy+" "+(x2-2)+","+(cy+4)} fill={X.bdr2}/></g>;
        })}

        {PIPELINE.map((p,i)=>{
          const x=nx(i), isAct=active===i;
          return (
            <g key={p.id} onClick={()=>setActive(isAct?null:i)} style={{ cursor:"pointer" }}>
              <rect x={x} y={nodeY} width={nodeW} height={nodeH} rx={12} fill={isAct?p.bg:X.surf} stroke={isAct?p.color:X.bdr} strokeWidth={isAct?2:1}/>
              {isAct && <rect x={x-2} y={nodeY-2} width={nodeW+4} height={nodeH+4} rx={14} fill="none" stroke={p.color} strokeWidth="1" opacity=".3"/>}
              <text x={x+nodeW/2} y={nodeY+22} textAnchor="middle" fontSize="15">{p.icon}</text>
              {p.label.split("\n").map((ln,li)=>(
                <text key={li} x={x+nodeW/2} y={nodeY+38+li*11} textAnchor="middle" fontSize="7.5" fontWeight="700" fill={X.t2} fontFamily="Inter">{ln}</text>
              ))}
            </g>
          );
        })}

        {PIPELINE.map((p,i)=>{
          const cx=nx(i)+nodeW/2;
          return (
            <g key={"kpi"+i}>
              <line x1={cx} y1={nodeY+nodeH} x2={cx} y2={kpiY-6} stroke={X.bdr} strokeWidth="1" strokeDasharray="2 2"/>
              <text x={cx} y={kpiY+4} textAnchor="middle" fontSize="6" fontWeight="600" fill={X.t3} fontFamily="Inter">{p.kpi}</text>
            </g>
          );
        })}

        <rect x={60} y={H-58} width={W-120} height={50} rx={10} fill={X.surf} stroke={X.bdr} strokeWidth="1"/>
        <text x={W/2} y={H-42} textAnchor="middle" fontSize="7" fontWeight="700" fill={X.t3} letterSpacing=".1em" fontFamily="Inter">ACTIVATION CHANNELS</text>
        {CHANNELS.map((ch,i)=>{
          const chW=(W-160)/CHANNELS.length;
          const cx=80+i*chW+chW/2;
          return (
            <g key={i}>
              <text x={cx} y={H-22} textAnchor="middle" fontSize="12">{ch.icon}</text>
              <text x={cx} y={H-11} textAnchor="middle" fontSize="5.5" fill={X.t2} fontFamily="Inter">{ch.name}</text>
            </g>
          );
        })}
      </svg>

      {active!==null && (
        <div className="fu" style={{ marginTop:16, padding:"20px 24px", background:PIPELINE[active].bg, borderRadius:14, border:"1px solid "+PIPELINE[active].color+"22", display:"flex", gap:20, alignItems:"flex-start" }}>
          <div style={{ fontSize:32 }}>{PIPELINE[active].icon}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:15, fontWeight:700, color:X.t1, marginBottom:6 }}>{PIPELINE[active].agent}</div>
            <div style={{ fontSize:12, color:X.t2, lineHeight:1.6, marginBottom:10 }}>{PIPELINE[active].desc}</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              <Badge text={"Differentiator: "+PIPELINE[active].diff} color={PIPELINE[active].color}/>
              <Badge text={"KPI: "+PIPELINE[active].kpi} color={X.t1} bg={X.t1+"0a"}/>
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

function AboutSection() {
  return (
    <div className="fu" style={{ animationDelay:".2s", margin:"24px 24px 0", display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
      <div style={{ background:X.card, borderRadius:18, border:"1px solid "+X.bdr, boxShadow:X.sh, padding:"28px 32px" }}>
        <div style={{ fontSize:10, fontWeight:800, color:X.coral, letterSpacing:".08em", textTransform:"uppercase", marginBottom:8 }}>About This Accelerator</div>
        <div style={{ fontSize:18, fontWeight:800, color:X.t1, marginBottom:12 }}>What is AssureAI?</div>
        <p style={{ fontSize:13, color:X.t2, lineHeight:1.7, marginBottom:14 }}>AssureAI is a pre-built AI accelerator within the <strong style={{ color:X.t1 }}>CX Nova Marketplace</strong> — purpose-built for insurers to improve renewal retention, coverage expansion, service journeys, and claims communication.</p>
        <p style={{ fontSize:13, color:X.t2, lineHeight:1.7, marginBottom:14 }}>It unifies policy, claims, household, broker, and behavioral data to score risk, identify intent, recommend next best actions, and activate personalized journeys across insurance channels.</p>
        <p style={{ fontSize:13, color:X.t2, lineHeight:1.7 }}>From signal detection to journey activation in <strong style={{ color:X.t1 }}>minutes, not months</strong> — with a consistent CX Nova experience and insurance-ready AI orchestration.</p>
      </div>
      <div style={{ background:X.card, borderRadius:18, border:"1px solid "+X.bdr, boxShadow:X.sh, padding:"28px 32px" }}>
        <div style={{ fontSize:10, fontWeight:800, color:X.coral, letterSpacing:".08em", textTransform:"uppercase", marginBottom:8 }}>Industry Use Cases</div>
        <div style={{ fontSize:18, fontWeight:800, color:X.t1, marginBottom:16 }}>Built for Insurance & Protection</div>
        {[
          { icon:"🧾", title:"Renewal Retention", desc:"Detect premium-shock and dissatisfaction signals early, then launch save journeys before policy lapse." },
          { icon:"🏠", title:"Coverage Expansion", desc:"Identify underinsured households and recommend the right protection bundle at the right moment." },
          { icon:"📣", title:"Claims & Service Journeys", desc:"Personalize service messages, claim updates, and reassurance content across digital and assisted channels." },
        ].map((uc,i)=>(
          <div key={i} className="si" style={{ animationDelay:i*.08+"s", display:"flex", gap:12, marginBottom:i<2?16:0, alignItems:"flex-start" }}>
            <div style={{ width:38, height:38, borderRadius:12, background:X.surf, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0, border:"1px solid "+X.bdr }}>{uc.icon}</div>
            <div>
              <div style={{ fontSize:13, fontWeight:800, color:X.t1, marginBottom:2 }}>{uc.title}</div>
              <div style={{ fontSize:12, color:X.t2, lineHeight:1.55 }}>{uc.desc}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OutcomesStrip() {
  return (
    <section className="fu" style={{ animationDelay:".22s", margin:"24px 24px 0", display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14 }}>
      {OUTCOMES.map((o,i)=>(
        <div key={i} className="hover-lift" style={{ background:X.card, borderRadius:16, padding:"20px 24px", border:"1px solid "+X.bdr, boxShadow:X.sh, display:"flex", alignItems:"center", gap:16 }}>
          <div style={{ fontSize:30, fontWeight:800, color:o.color, fontFamily:mono, letterSpacing:"-.02em", whiteSpace:"nowrap" }}>{o.stat}</div>
          <div style={{ fontSize:13, color:X.t1, fontWeight:700, lineHeight:1.3 }}>{o.label}</div>
        </div>
      ))}
    </section>
  );
}

function DemoSection() {
  const [running, setRunning] = useState(null);
  const [stepStates, setStepStates] = useState([]);
  const [demoTab, setDemoTab] = useState("flow");
  const [claimed, setClaimed] = useState(false);

  const runDemo = useCallback(async (ucIdx) => {
    const uc = USE_CASES[ucIdx];
    setRunning(ucIdx);
    setDemoTab("flow");
    setClaimed(false);
    setStepStates(new Array(uc.steps.length).fill("pending"));
    for (let i = 0; i < uc.steps.length; i++) {
      setStepStates(prev => { const n=[...prev]; n[i]="running"; return n; });
      await new Promise(r => setTimeout(r, 700 + Math.random()*350));
      setStepStates(prev => { const n=[...prev]; n[i]="done"; return n; });
    }
    setDemoTab("experience");
  }, []);

  const resetDemo = () => {
    setRunning(null); setStepStates([]); setClaimed(false); setDemoTab("flow");
  };

  const uc = running !== null ? USE_CASES[running] : null;
  const progress = uc ? (stepStates.filter(s=>s==="done").length / uc.steps.length)*100 : 0;

  return (
    <section className="fu" style={{ animationDelay:".25s", margin:"24px 24px 0", background:X.card, borderRadius:18, border:"1px solid "+X.bdr, boxShadow:X.sh, padding:"28px 32px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
        <div>
          <div style={{ fontSize:10, fontWeight:800, color:X.coral, letterSpacing:".08em", textTransform:"uppercase", marginBottom:4 }}>Interactive Demo</div>
          <div style={{ fontSize:18, fontWeight:800, color:X.t1 }}>Experience AssureAI in Action</div>
        </div>
        {running!==null && <button onClick={resetDemo} style={{ fontSize:11, color:X.t3, background:"none", border:"1px solid "+X.bdr, borderRadius:8, padding:"5px 14px", cursor:"pointer" }}>← Back to Use Cases</button>}
      </div>

      {running===null && (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
          {USE_CASES.map((u,i)=>(
            <div key={u.id} className="hover-lift" style={{ border:"1px solid "+X.bdr, borderRadius:16, padding:"22px 24px", cursor:"pointer", background:X.card }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                <div style={{ width:40, height:40, borderRadius:12, background:u.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{u.icon}</div>
                <div>
                  <div style={{ fontSize:14, fontWeight:800, color:X.t1 }}>{u.title}</div>
                  <div style={{ fontSize:11, color:X.t2, lineHeight:1.4, marginTop:2 }}>{u.subtitle}</div>
                </div>
              </div>
              <div style={{ display:"flex", gap:6, marginBottom:14, flexWrap:"wrap" }}>
                <Badge text={u.client.segment} color={u.color}/>
                <Badge text={u.client.policy} color={X.t1} bg={X.surf}/>
                <Badge text={u.client.premium} color={X.t2} bg={X.surf}/>
              </div>
              <button onClick={()=>runDemo(i)} style={{ width:"100%", padding:"10px", borderRadius:12, border:"none", background:u.color, color:"#fff", fontSize:12, fontWeight:800, cursor:"pointer" }}>Launch Demo →</button>
            </div>
          ))}
        </div>
      )}

      {running!==null && uc && (
        <div style={{ display:"grid", gridTemplateColumns:"340px 1fr", gap:20 }}>
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div style={{ background:uc.bg, borderRadius:14, padding:"14px 16px", border:"1px solid "+uc.color+"22" }}>
              <div style={{ fontSize:10, fontWeight:800, color:uc.color, letterSpacing:".04em", marginBottom:8, textTransform:"uppercase" }}>{uc.trigger.title}</div>
              {uc.trigger.signals.map((sig,i)=>(
                <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:i<uc.trigger.signals.length-1?8:0 }}>
                  <Badge text={sig.sev} color={sig.sev==="critical"?X.red:sig.sev==="high"?X.amber:X.blue} style={{ fontSize:8, padding:"1.5px 6px" }}/>
                  <div>
                    <div style={{ fontSize:9, color:X.t3, fontWeight:700 }}>{sig.s}</div>
                    <div style={{ fontSize:10, color:X.t1, lineHeight:1.3 }}>{sig.e}</div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ background:X.surf, borderRadius:14, padding:"14px 16px", border:"1px solid "+X.bdr }}>
              <div style={{ fontSize:10, fontWeight:800, color:X.t1, marginBottom:8, letterSpacing:".04em", textTransform:"uppercase" }}>Policyholder 360 View</div>
              {Object.entries(uc.client).map(([k,v])=>(
                <div key={k} style={{ display:"flex", justifyContent:"space-between", fontSize:10.5, marginBottom:4 }}>
                  <span style={{ color:X.t3, fontWeight:500 }}>{k.replace(/([A-Z])/g," $1").replace(/^./,s=>s.toUpperCase())}</span>
                  <span style={{ color:X.t1, fontWeight:700, fontFamily:mono, fontSize:10 }}>{v}</span>
                </div>
              ))}
            </div>

            <div style={{ background:X.surf, borderRadius:14, padding:"14px 16px", border:"1px solid "+X.bdr, flex:1 }}>
              <div style={{ fontSize:10, fontWeight:800, color:X.t1, marginBottom:8, letterSpacing:".04em", textTransform:"uppercase" }}>Agent Pipeline Execution</div>
              <div style={{ height:4, borderRadius:4, background:X.bdr, marginBottom:12, overflow:"hidden" }}>
                <div style={{ height:"100%", width:progress+"%", background:uc.color, borderRadius:4, transition:"width .3s ease" }}/>
              </div>
              {uc.steps.map((st,i)=>{
                const state=stepStates[i]||"pending";
                return (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, opacity:state==="pending"?.45:1, transition:"opacity .3s" }}>
                    <div style={{ width:20, height:20, borderRadius:6, background:state==="done"?PIPELINE[i].color+"18":state==="running"?X.coral+"14":X.bdr, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, flexShrink:0 }}>
                      {state==="done"?"✓":state==="running"?<span style={{ display:"inline-block", animation:"spin .8s linear infinite" }}>⚙️</span>:<span style={{ color:X.t3, fontSize:9 }}>{i+1}</span>}
                    </div>
                    <div style={{ fontSize:10, color:state==="done"?X.t1:X.t3, fontWeight:state==="running"?700:500, flex:1, lineHeight:1.3 }}>{st.t}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div>
            <div style={{ display:"flex", gap:0, marginBottom:16, borderBottom:"1px solid "+X.bdr }}>
              {[["flow","🤖 Agent Flow"],["experience","📱 Experience"],["data","📊 Data"]].map(([id,label])=>(
                <button key={id} onClick={()=>setDemoTab(id)} style={{ fontSize:11, fontWeight:demoTab===id?800:600, color:demoTab===id?uc.color:X.t3, background:"none", border:"none", borderBottom:demoTab===id?"2px solid "+uc.color:"2px solid transparent", padding:"8px 18px", cursor:"pointer" }}>{label}</button>
              ))}
            </div>

            {demoTab==="flow" && (
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {PIPELINE.map((p,i)=>{
                  const state=stepStates[i]||"pending";
                  return (
                    <div key={p.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", borderRadius:12, background:state==="done"?p.bg:state==="running"?X.coral+"08":X.surf, border:"1px solid "+(state==="done"?p.color+"30":X.bdr), opacity:state==="pending"?.5:1 }}>
                      <div style={{ fontSize:20 }}>{p.icon}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:11, fontWeight:800, color:X.t1 }}>{p.agent}</div>
                        <div style={{ fontSize:9.5, color:X.t3, marginTop:2 }}>{p.diff}</div>
                      </div>
                      <Badge text={state==="done"?"Complete":state==="running"?"Processing...":"Pending"} color={state==="done"?p.color:state==="running"?X.coral:X.t3}/>
                    </div>
                  );
                })}
              </div>
            )}

            {demoTab==="experience" && (
              <div className="fu" style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"20px 0" }}>
                <div style={{ width:360, background:X.surf, borderRadius:16, padding:"14px 16px", border:"1px solid "+X.bdr, boxShadow:X.sh }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                    <div style={{ width:24, height:24, borderRadius:6, background:"linear-gradient(135deg,"+X.coral+","+X.orange+")", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, color:"#fff" }}>A</div>
                    <div style={{ fontSize:10, fontWeight:700, color:X.t2 }}>AssureAI · Now</div>
                  </div>
                  <div style={{ fontSize:12, fontWeight:800, color:X.t1, marginBottom:3 }}>{uc.offer.headline}</div>
                  <div style={{ fontSize:11, color:X.t2, lineHeight:1.4 }}>{uc.offer.action}</div>
                </div>

                <div style={{ width:360, background:"linear-gradient(135deg,"+uc.color+"10,"+uc.color+"05)", borderRadius:16, padding:"22px 20px", border:"1px solid "+uc.color+"22" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                    <span style={{ fontSize:22 }}>{uc.icon}</span>
                    <div style={{ fontSize:14, fontWeight:800, color:X.t1 }}>{uc.offer.headline}</div>
                  </div>
                  <div style={{ fontSize:12, color:X.t2, lineHeight:1.6, marginBottom:14 }}>{uc.offer.action}</div>
                  <div style={{ background:X.card, borderRadius:10, padding:"10px 14px", marginBottom:14, border:"1px solid "+X.bdr }}>
                    <div style={{ fontSize:10, fontWeight:700, color:X.t3, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4 }}>Expected Benefit</div>
                    <div style={{ fontSize:12, fontWeight:800, color:uc.color }}>{uc.offer.benefit}</div>
                  </div>
                  <div style={{ display:"flex", gap:12, marginBottom:14 }}>
                    <div style={{ flex:1, textAlign:"center", background:X.card, borderRadius:10, padding:"10px 8px", border:"1px solid "+X.bdr }}>
                      <div style={{ fontSize:8, color:X.t3, fontWeight:700, textTransform:"uppercase", marginBottom:2 }}>Before</div>
                      <div style={{ fontSize:18, fontWeight:800, color:X.red, fontFamily:mono }}>{uc.result.before}</div>
                      <div style={{ fontSize:9, color:X.t3 }}>{uc.result.metric}</div>
                    </div>
                    <div style={{ flex:1, textAlign:"center", background:X.card, borderRadius:10, padding:"10px 8px", border:"1px solid "+X.bdr }}>
                      <div style={{ fontSize:8, color:X.t3, fontWeight:700, textTransform:"uppercase", marginBottom:2 }}>After</div>
                      <div style={{ fontSize:18, fontWeight:800, color:X.green, fontFamily:mono }}>{uc.result.after}</div>
                      <div style={{ fontSize:9, color:X.t3 }}>{uc.result.metric}</div>
                    </div>
                  </div>
                  {!claimed ? (
                    <button onClick={()=>setClaimed(true)} style={{ width:"100%", padding:"10px", borderRadius:12, border:"none", background:uc.color, color:"#fff", fontSize:12, fontWeight:800, cursor:"pointer" }}>{uc.offer.cta} →</button>
                  ) : (
                    <div style={{ textAlign:"center", padding:"10px", borderRadius:12, background:X.greenB, border:"1px solid "+X.green+"22" }}>
                      <span style={{ fontSize:16 }}>✅</span>
                      <div style={{ fontSize:12, fontWeight:800, color:X.green, marginTop:2 }}>Action Confirmed</div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {demoTab==="data" && (
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <div style={{ fontSize:10, fontWeight:800, color:X.t3, letterSpacing:".06em", textTransform:"uppercase", marginBottom:4 }}>Pipeline Data Flow</div>
                {uc.steps.map((st,i)=>{
                  const state=stepStates[i]||"pending";
                  if(state==="pending") return null;
                  return (
                    <div key={i}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                        <span style={{ fontSize:14 }}>{PIPELINE[i].icon}</span>
                        <span style={{ fontSize:11, fontWeight:800, color:X.t1 }}>{PIPELINE[i].agent}</span>
                        <Badge text={"Step "+(i+1)} color={PIPELINE[i].color} style={{ fontSize:8 }}/>
                      </div>
                      <DataBlock entries={st.d} color={PIPELINE[i].color}/>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

function Footer() {
  return (
    <footer style={{ margin:"24px", padding:"24px 32px", background:X.card, borderRadius:18, border:"1px solid "+X.bdr, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
        <CXNovaLogo size={16}/>
        <div style={{ width:1, height:18, background:X.bdr2 }}/>
        <div>
          <div style={{ fontSize:12, fontWeight:800, color:X.t1 }}>AssureAI</div>
          <div style={{ fontSize:10, color:X.t3 }}>AI-powered real-time personalization for insurance & protection</div>
        </div>
      </div>
      <div style={{ fontSize:10, color:X.t3 }}>© 2026 Coforge · CX Nova Marketplace · All rights reserved</div>
    </footer>
  );
}

function App() {
  const [active, setActive] = useState(null);
  return (
    <div style={{ minHeight:"100vh", background:X.bg }}>
      <Header/>
      <Hero/>
      <KpiStrip/>
      <ArchDiagram active={active} setActive={setActive}/>
      <AboutSection/>
      <OutcomesStrip/>
      <DemoSection/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
